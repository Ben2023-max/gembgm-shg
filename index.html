const GOOGLE_API_URL = "PASTE_YOUR_COPIED_WEB_APP_URL_HERE";

let currentActiveName = "";
let fullReportData = [];
let currentActiveTab = "form";
let isEditingMode = false;
let originalValueBeforeEdit = 0;

window.onload = function() {
  startLiveClock();
  loadRosterNames();
};

function startLiveClock() {
  function updateClock() {
    const now = new Date();
    const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
    const formattedDate = now.toLocaleDateString('en-US', dateOptions);
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    document.getElementById("liveClockDisplay").textContent = formattedDate + " " + String(hours).padStart(2, '0') + ":" + minutes + ":" + seconds + " " + ampm;
  }
  updateClock();
  setInterval(updateClock, 1000);
}

// Fetch member names across the web from Google Sheets
function loadRosterNames() {
  document.getElementById("loadingMessage").textContent = "Locating Spreadsheet Roster...";
  document.getElementById("loadingMessage").style.display = "block";
  
  // Custom execution calling gas via macros alternative for standalone github pages
  fetch(`${GOOGLE_API_URL}?action=getNames`)
    .then(res => res.json())
    .then(names => buildTapMenu(names))
    .catch(err => {
      document.getElementById("loadingMessage").textContent = "Error loading roster: " + err.message;
    });
}

function buildTapMenu(names) {
  document.getElementById("loadingMessage").style.display = "none";
  const container = document.getElementById("listOfMembers");
  container.innerHTML = "";
  names.forEach(name => {
    const card = document.createElement("div");
    card.className = "member-card";
    card.setAttribute("data-name", name.toLowerCase());
    card.innerHTML = `<span>${name}</span><span class="chevron">&#8250;</span>`;
    card.onclick = () => openInputWindow(name);
    container.appendChild(card);
  });
}

function submitData() {
  const header = document.getElementById("headerSelect").value;
  const amountStr = document.getElementById("amountInput").value.trim();
  const statusDiv = document.getElementById("status");

  let targetValue = parseFloat(amountStr) || 0;
  let valueToSend = isEditingMode ? (targetValue - originalValueBeforeEdit) : targetValue;

  statusDiv.style.display = "block";
  statusDiv.className = "";
  statusDiv.textContent = "Processing entries...";

  // Pushing payment entries across the web directly into your Google Sheet
  fetch(GOOGLE_API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "addContribution",
      name: currentActiveName,
      header: header,
      amount: String(valueToSend)
    })
  })
  .then(res => res.json())
  .then(response => {
    if(response.status === "success") {
      showNotification("Record synced successfully!", "success");
      setTimeout(() => {
        closeModal();
        switchHarambeeTab('view');
      }, 1200);
    } else {
      showNotification(response.message, "error");
    }
  })
  .catch(err => showNotification("Network connection error.", "error"));
}

function loadLiveBalancesReport() {
  document.getElementById("tableLoadingMessage").style.display = "block";
  document.getElementById("reportContainer").style.display = "none";
  
  fetch(`${GOOGLE_API_URL}?action=getBalances`)
    .then(res => res.json())
    .then(data => renderBalancesTable(data))
    .catch(err => {
      document.getElementById("tableLoadingMessage").textContent = "Failed to sync: " + err.message;
    });
}

function openProjectsRegistry() {
  switchPage('projectsPage');
  const container = document.getElementById("projectCardsContainer");
  container.innerHTML = '<div class="loading">Loading active projects...</div>';
  
  fetch(`${GOOGLE_API_URL}?action=getProjects`)
    .then(res => res.json())
    .then(projects => {
      container.innerHTML = "";
      if (projects.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#666;">No active projects registered yet.</p>';
        return;
      }
      projects.forEach(proj => {
        const cardRow = document.createElement("div");
        cardRow.className = "project-card";
        cardRow.innerHTML = `
          <div class="project-card-header"><h4 class="project-title">${proj.name}</h4><span class="project-amt-badge">Ksh ${parseFloat(proj.amount).toLocaleString()} / Member</span></div>
          <div class="project-details-grid"><div>Start Date: <span>${proj.startDate}</span></div><div>End Date: <span>${proj.endDate}</span></div></div>
        `;
        container.appendChild(cardRow);
      });
    })
    .catch(err => {
      container.innerHTML = '<div class="loading" style="color:red;">Error loading projects.</div>';
    });
}

function submitNewProject() {
  const name = document.getElementById("projNameInput").value.trim();
  const start = document.getElementById("projStartDate").value;
  const end = document.getElementById("projEndDate").value;
  const amt = document.getElementById("projAmtPerMember").value.trim();
  const statLabel = document.getElementById("projectStatus");

  if(!name || !start || !end || !amt) {
    statLabel.style.display = "block";
    statLabel.className = "error";
    statLabel.textContent = "All form details are required.";
    return;
  }

  statLabel.style.display = "block";
  statLabel.className = "success";
  statLabel.textContent = "Sending to Google Sheet...";

  fetch(GOOGLE_API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "saveProject",
      name: name,
      startDate: start,
      endDate: end,
      amount: amt
    })
  })
  .then(res => res.json())
  .then(response => {
    statLabel.textContent = "Saved to Database!";
    setTimeout(() => {
      closeProjectModal();
      openProjectsRegistry();
    }, 1000);
  })
  .catch(err => {
    statLabel.className = "error";
    statLabel.textContent = "Failed to save.";
  });
}
